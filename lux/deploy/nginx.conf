# Proxy inverso con TLS para Drive.
#
# Lux sólo habla HTTP/1.1 sin cifrar: el TLS, HTTP/2 y las cabeceras de
# seguridad se ponen aquí. deploy/setup-tls.sh rellena esta plantilla y la
# instala; también puedes copiarla a mano a /etc/nginx/sites-available/drive,
# sustituyendo los marcadores __…__, y enlazarla en sites-enabled.
#
#   __DOMINIO__    nombre o IP con la que se accede (server_name)
#   __PUERTO__     puerto público (443, o uno alto como 4023)
#   __CERT__       ruta del certificado (fullchain.pem)
#   __CLAVE__      ruta de la clave privada
#   __APP_PORT__   puerto de Lux (BIND_PORT, 8000 por defecto)
#   __HSTS__       la línea add_header de HSTS, o nada (sólo con un certificado
#                  de una CA reconocida; con uno autofirmado dejaría el
#                  navegador clavado en un sitio que no puede validar)

upstream drive_app {
    server 127.0.0.1:__APP_PORT__;
    keepalive 32;
}

server {
    # La forma "listen ... ssl http2" funciona en todas las versiones. La
    # directiva separada "http2 on;" sólo existe desde nginx 1.25.1, y Ubuntu
    # 24.04 viene con la 1.24.
    listen __PUERTO__ ssl http2;
    listen [::]:__PUERTO__ ssl http2;
    server_name __DOMINIO__;

    ssl_certificate     __CERT__;
    ssl_certificate_key __CLAVE__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Debe ser mayor o igual que storage.max_upload_size y que DRIVE_MAX_BODY
    # (2GB por defecto), o nginx cortará las subidas antes de que Lux las vea.
    client_max_body_size 4g;
    client_body_timeout 300s;

    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    access_log /var/log/nginx/drive.access.log;
    error_log  /var/log/nginx/drive.error.log;

    # Lux ya pone la CSP, X-Content-Type-Options, X-Frame-Options y
    # Referrer-Policy (app: headers). Falta HSTS, que sólo sabe nginx (el que
    # termina el TLS).
    __HSTS__

    location /static/ {
        proxy_pass http://drive_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://drive_app;
        proxy_http_version 1.1;

        # Sin esto la aplicación no puede saber la IP real del cliente y las
        # redes de confianza dejan de funcionar. Va acompañado de
        # server.behind_proxy=true y server.trusted_proxies=127.0.0.1/32 en
        # config.json. $http_host (y no $host) conserva el puerto no estándar.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Connection        "";

        # Streaming: las descargas empiezan de inmediato y no llenan el disco
        # de nginx.
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

