{% extends "base.html" %}
{% block title %}Enlace protegido · {{ c["app_name"] }}{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="card">
    <h1>Enlace protegido</h1>
    <p class="muted">Introduce la contraseña que te hayan facilitado.</p>
    <form method="post" action="/s/{{ c["token"] }}">
      <div class="field">
        <input name="password" type="password" required autofocus style="width:100%">
      </div>
      <button class="primary" type="submit" style="width:100%">Acceder</button>
    </form>
  </div>
</div>
{% endblock %}
