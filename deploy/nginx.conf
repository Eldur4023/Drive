# Proxy inverso para Drive.
#
# Copiar a /etc/nginx/sites-available/drive y enlazar en sites-enabled.
# Los certificados se obtienen con:  certbot --nginx -d drive.ejemplo.com

upstream drive_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Redirección a HTTPS. Se deja pasar el reto de Let's Encrypt.
server {
    listen 80;
    listen [::]:80;
    server_name drive.ejemplo.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # La forma "listen ... ssl http2" funciona en todas las versiones. La
    # directiva separada "http2 on;" sólo existe desde nginx 1.25.1, y Ubuntu
    # 24.04 viene con la 1.24.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name drive.ejemplo.com;

    ssl_certificate     /etc/letsencrypt/live/drive.ejemplo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drive.ejemplo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Tamaño máximo de subida. Debe ser mayor o igual que
    # storage.max_upload_size en config.yaml, o nginx cortará antes.
    client_max_body_size 4G;
    client_body_timeout 300s;
    client_body_buffer_size 1m;

    # Las subidas y descargas grandes no deben morir por timeout.
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    access_log /var/log/nginx/drive.access.log;
    error_log  /var/log/nginx/drive.error.log;

    location /static/ {
        proxy_pass http://drive_app;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://drive_app;
        proxy_http_version 1.1;

        # Sin esto la aplicación no puede saber la IP real del cliente y las
        # redes de confianza dejan de funcionar. Debe ir acompañado de
        # server.behind_proxy=true y server.trusted_proxies=127.0.0.1/32.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Streaming: sin buffering las descargas grandes no llenan el disco de
        # nginx y el navegador empieza a recibir de inmediato.
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
