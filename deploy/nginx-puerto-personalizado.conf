# Proxy inverso para Drive escuchando en un puerto NO estándar (aquí 4023).
#
# Útil cuando el 80/443 ya están ocupados o tu operador los bloquea.
# Copiar a /etc/nginx/sites-available/drive y enlazar en sites-enabled.
#
# Reparto de puertos:
#   4023  -> lo que abres al exterior; aquí escucha nginx
#   8000  -> la aplicación, sólo en 127.0.0.1 (nunca se expone)
#   80    -> se deja SÓLO para el reto de Let's Encrypt (ver más abajo)
#
# Con esta configuración la instancia queda en https://tu.dominio:4023

upstream drive_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# Puerto 80: únicamente para renovar el certificado.
#
# Let's Encrypt valida por HTTP-01 contra el puerto 80, siempre, y no admite
# otro. Si cierras el 80 al exterior, certbot no podrá emitir ni RENOVAR el
# certificado y en 90 días la instancia se quedará sin TLS.
#
# Tienes dos salidas:
#   a) Dejar el 80 abierto sólo con este bloque. No sirve la aplicación: sólo
#      responde al reto ACME y manda todo lo demás al 4023. Es lo más simple.
#   b) Cerrar el 80 y usar validación DNS-01:
#         sudo certbot certonly --preferred-challenges dns --manual -d tu.dominio
#      Sin plugin de tu proveedor de DNS, la renovación será manual.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name tu.dominio;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host:4023$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Puerto 4023: la aplicación.
# ---------------------------------------------------------------------------
server {
    # La forma "listen ... ssl http2" funciona en todas las versiones. La
    # directiva separada "http2 on;" sólo existe desde nginx 1.25.1, y Ubuntu
    # 24.04 viene con la 1.24.
    listen 4023 ssl http2;
    listen [::]:4023 ssl http2;
    server_name tu.dominio;

    ssl_certificate     /etc/letsencrypt/live/tu.dominio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tu.dominio/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Debe ser mayor o igual que storage.max_upload_size, o nginx cortará las
    # subidas antes de que la aplicación llegue a verlas.
    client_max_body_size 4G;
    client_body_timeout 300s;
    client_body_buffer_size 1m;

    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    access_log /var/log/nginx/drive.access.log;
    error_log  /var/log/nginx/drive.error.log;

    location /static/ {
        proxy_pass http://drive_app;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://drive_app;
        proxy_http_version 1.1;

        # Con un puerto no estándar hay que usar $http_host y no $host:
        # $host descarta el ":4023" y cualquier redirección que construya la
        # aplicación acabaría apuntando al puerto equivocado.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Connection        "";

        # Sin buffering, las descargas grandes empiezan de inmediato y no
        # llenan el disco de nginx.
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

